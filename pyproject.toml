[project]
name = "lerobot-ood"
version = "0.1.0"
description = "OOD detection wrapped around lerobot policy inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech]>=0.5",
    "torch>=2.1",
    "torchvision",
    "numpy",
    "scikit-learn",
    "huggingface_hub",
    "draccus",
    "opencv-python",
    "sounddevice",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
